[package]
name = "google-chat-tauri"
version = "0.0.8"
description = "Google Chat"
authors = ["Kainoa Kanter <kainoa@t1c.dev>"]
license = ""
repository = "https://github.com/ThatOneCalculator/google-chat-tauri"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.3", features = [] }

[dependencies]
tauri = { version = "1.7.1", features = [ "notification-all", "updater", "shell-open", "system-tray", "path-all", "global-shortcut" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-persisted-scope = "0.1.0"
tauri-plugin-deep-link = "0.1.1"


[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]


